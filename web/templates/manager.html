<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>店长时段管理｜茸茸洗护</title><style>
body{margin:0;background:#f4f6f2;color:#17211b;font:15px/1.55 "Microsoft YaHei",sans-serif}main{max-width:900px;margin:32px auto;padding:0 18px}.card,header{background:white;border-radius:16px;padding:22px;margin-bottom:18px;box-shadow:0 8px 30px #24402d12}h1,h2{color:#176b49;margin-top:0}.ok,.err{padding:12px;border-radius:10px;margin-bottom:14px}.ok{background:#e8f6ed}.err{background:#fff0ed;color:#a33222}input{padding:9px;border:1px solid #ccd8cf;border-radius:7px}button{padding:10px 16px;background:#176b49;color:white;border:0;border-radius:8px;cursor:pointer}table{width:100%;border-collapse:collapse}td,th{padding:10px;border-bottom:1px solid #edf0ed;text-align:left}a{color:#176b49}
</style></head><body><main><header><a href="/">返回身份选择</a>　<a href="/manager/no-shows">进入未到店处理</a>　<a href="/manager/daily">进入日清核查</a><h1>{{.Identity.DisplayName}}的时段管理</h1><p>发布同一门店、同一项目的时段时不能重叠，端点相接允许。</p></header>
{{if .Error}}<div class="err">操作失败：{{.Error}}</div>{{end}}{{if .Success}}<div class="ok">{{.Success}}</div>{{end}}
<section class="card"><h2>发布新时段</h2><form method="post" action="/manager/slots"><label>开始 <input required type="datetime-local" name="starts_at"></label>　<label>结束 <input required type="datetime-local" name="ends_at"></label>　<button>发布（容量 3）</button></form></section>
<section class="card"><h2>已发布时段</h2><table><thead><tr><th>开始</th><th>结束</th><th>已占用</th><th>剩余</th></tr></thead><tbody>{{range .Slots}}<tr><td>{{storeTime .StartsAt}}</td><td>{{storeTime .EndsAt}}</td><td>{{.Occupied}}</td><td>{{.Available}}</td></tr>{{else}}<tr><td colspan="4">暂无时段</td></tr>{{end}}</tbody></table></section>
</main></body></html>
