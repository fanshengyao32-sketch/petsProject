<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <title>宠物门店原型自动测试</title>
  <style>
    body{margin:0;padding:28px;background:#f4f2eb;color:#17211b;font:14px/1.5 "Microsoft YaHei",sans-serif}
    main{max-width:1100px;margin:auto;background:white;padding:24px;border-radius:16px;box-shadow:0 15px 45px #183b2520}
    h1{margin:0 0 6px} .summary{display:flex;gap:12px;margin:18px 0}.box{padding:12px 18px;border-radius:10px;background:#eef3f0}.pass{color:#176b49}.fail{color:#b74343}
    table{width:100%;border-collapse:collapse}th,td{padding:10px;border-bottom:1px solid #dfe7e2;text-align:left}th{background:#f7faf8}
    iframe{position:fixed;left:-10000px;width:1440px;height:1000px;border:0}
  </style>
</head>
<body>
<main>
  <h1>原型真实交互自动测试</h1>
  <p>本页在同源 iframe 中真实点击原型按钮、填写表单、刷新页面并检查共享状态。</p>
  <div class="summary"><div class="box">总数 <b id="total">0</b></div><div class="box pass">通过 <b id="passed">0</b></div><div class="box fail">失败 <b id="failed">0</b></div><div class="box">状态 <b id="status">运行中</b></div></div>
  <table><thead><tr><th>#</th><th>测试场景</th><th>实际检查结果</th><th>结论</th></tr></thead><tbody id="results"></tbody></table>
</main>
<iframe id="app" src="交互原型.html"></iframe>
<script>
const STORAGE_KEY='pet-shop-prototype-v2';
const frame=document.getElementById('app');
const results=[];
const wait=ms=>new Promise(r=>setTimeout(r,ms));
const doc=()=>frame.contentDocument;
const win=()=>frame.contentWindow;
const state=()=>JSON.parse(win().localStorage.getItem(STORAGE_KEY));
const click=selector=>{const el=doc().querySelector(selector);if(!el)throw new Error(`找不到元素 ${selector}`);el.click();return el};
const input=(selector,value)=>{const el=doc().querySelector(selector);if(!el)throw new Error(`找不到输入框 ${selector}`);el.value=value;el.dispatchEvent(new Event('input',{bubbles:true}));return el};
const text=selector=>doc().querySelector(selector)?.textContent.trim()||'';
const assert=(condition,message)=>{if(!condition)throw new Error(message)};
async function loaded(){if(frame.contentDocument?.readyState==='complete')return;await new Promise(resolve=>frame.addEventListener('load',resolve,{once:true}))}
async function reset(){win().localStorage.removeItem(STORAGE_KEY);frame.src='交互原型.html?test='+Math.random();await loaded();await wait(80)}
async function test(name,fn){try{await fn();results.push({name,detail:'断言全部满足',pass:true})}catch(error){results.push({name,detail:error.message,pass:false})}render()}
function render(){const body=document.getElementById('results');body.innerHTML=results.map((r,i)=>`<tr><td>${i+1}</td><td>${r.name}</td><td>${r.detail}</td><td class="${r.pass?'pass':'fail'}"><b>${r.pass?'通过':'失败'}</b></td></tr>`).join('');document.getElementById('total').textContent=results.length;document.getElementById('passed').textContent=results.filter(x=>x.pass).length;document.getElementById('failed').textContent=results.filter(x=>!x.pass).length}
(async()=>{
  await loaded();
  await test('待支付预约倒计时与付款联动',async()=>{await reset();assert(/待支付 \d{2}:\d{2}/.test(text('#pendingStatus')),'未显示真实倒计时');click('#payBtn');await wait(20);assert(state().pending.status==='paid','本地状态未变为 paid');assert(text('#pendingStatus')==='已确认','页面未显示已确认');assert(text('#pendingMoney').includes('已付款'),'金额状态未联动')});
  await test('关闭后晚到支付不恢复预约',async()=>{await reset();click('#cancelUnpaid');click('[data-view="support"]');await wait(20);click('#simulateLatePayment');await wait(20);assert(state().pending.status==='late_paid','未登记晚到支付');assert(state().latePayment.status==='refund_required','未创建异常退款事实');assert(text('#latePaymentResult').includes('预约保持关闭'),'页面未说明预约保持关闭')});
  await test('核销→服务开始→完成并联动日清',async()=>{await reset();click('[data-view="desk"]');click('#checkinBtn');click('#startService');click('#finishService');assert(state().service.status==='completed','服务未完成');click('[data-view="manager"]');assert([...doc().querySelectorAll('#manager .metric b')].some(x=>x.textContent==='¥396.00'),'完成收入未联动增加')});
  await test('用户取消后前台不能核销',async()=>{await reset();click('.open-cancel');input('#cancelReason','宠物临时不适');click('#confirmCancel');assert(state().service.status==='cancelled','预约未取消');click('[data-view="desk"]');assert(doc().querySelector('#checkinBtn').disabled,'取消后核销按钮仍可用');assert(text('#checkinBtn').includes('禁止核销'),'未显示禁止核销原因')});
  await test('前台核销后用户取消被拒绝',async()=>{await reset();click('[data-view="desk"]');click('#checkinBtn');click('[data-view="owner"]');click('.attempt-cancel-after-checkin');assert(state().service.status==='checked_in','取消错误覆盖了核销结果');assert(text('#detailBody').includes('不能再走'),'页面未给出明确拒绝原因');assert(state().events.some(x=>x.action==='取消请求被拒绝'),'拒绝结果未记录')});
  await test('两条客服审核分别持久化',async()=>{await reset();click('[data-view="support"]');click('#reviewRow .approve');click('#reviewRow007 .reject');assert(state().review003.status==='approved','第一条未批准');assert(state().review007.status==='rejected','第二条未拒绝');assert(text('#reviewRow').includes('已批准'),'第一条页面未联动');assert(text('#reviewRow007').includes('已拒绝'),'第二条页面未联动')});
  await test('退款失败重试并更新日清金额',async()=>{await reset();click('[data-view="support"]');click('#retryRefund');assert(state().refund.status==='success','退款状态未成功');click('[data-view="manager"]');assert([...doc().querySelectorAll('#manager .metric b')].some(x=>x.textContent==='¥198.00'),'已退款金额未联动')});
  await test('店长发布时段后用户端可见',async()=>{await reset();click('[data-view="manager"]');click('#openSlot');input('#slotModal input[type="datetime-local"]','2026-11-16T18:00');input('#slotModal input[type="datetime-local"]:nth-of-type(1)','2026-11-16T18:00');const timeInputs=doc().querySelectorAll('#slotModal input[type="datetime-local"]');timeInputs[0].value='2026-11-16T18:00';timeInputs[1].value='2026-11-16T19:00';click('#confirmSlot');assert(state().extraSlots.length===1,'时段未保存');click('[data-view="owner"]');assert(text('.slot-list').includes('2026-11-16 18:00'),'用户端未显示新时段')});
  await test('未到店必须填写原因并保存',async()=>{await reset();click('[data-view="manager"]');click('#markNoShow');click('#confirmNoShow');assert(!state().noShow.marked,'空原因不应成功');input('#noShowReason','时段结束仍未到店，电话未接');click('#confirmNoShow');assert(state().noShow.marked,'未到店未保存');assert(text('#noShowRow').includes('电话未接'),'页面未展示原因')});
  await test('前台查询真实过滤接待列表',async()=>{await reset();click('[data-view="desk"]');input('#deskQuery','不存在的预约');click('#deskQueryBtn');assert(text('#deskQueryResult').includes('未找到'),'未显示查询失败');input('#deskQuery','BK20261115002');click('#deskQueryBtn');assert(text('#deskQueryResult').includes('找到 1 条'),'未显示唯一匹配结果')});
  await test('查看详情展示共享业务记录',async()=>{await reset();click('[data-view="desk"]');click('#checkinBtn');click('#viewIdempotency');assert(doc().querySelector('#detailModal').classList.contains('show'),'详情弹层未打开');assert(text('#detailBody').includes('已核销'),'详情未读取共享状态')});
  await test('导出日清清单产生审计事件',async()=>{await reset();click('[data-view="manager"]');click('#exportClosing');await wait(20);assert(state().events.some(x=>x.action==='导出日清清单'),'导出没有产生实际事件记录')});
  await test('刷新后业务状态仍保留',async()=>{await reset();click('[data-view="desk"]');click('#checkinBtn');frame.contentWindow.location.reload();await loaded();await wait(80);assert(state().service.status==='checked_in','刷新后核销状态丢失');click('[data-view="desk"]');assert(text('#serviceStatus')==='已核销','刷新后页面未恢复状态')});
  document.getElementById('status').textContent=results.every(x=>x.pass)?'全部通过':'存在失败';
  document.title=`原型自动测试：${results.filter(x=>x.pass).length}/${results.length} 通过`;
  document.body.dataset.finished='true';
})();
</script>
</body>
</html>
